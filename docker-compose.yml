services:
  db:
    image: postgres:17
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - 5434:5432
    expose:
      - 5434
    environment:
      - POSTGRES_DB=InventoryDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=chaiaurcode

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  redis:
    image: redis:7-alpine
    container_name: InventoryRedis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data

volumes:
  db_data:
  redis-data:
